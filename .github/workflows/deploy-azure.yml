name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: true

# Repository configuration required (see DEPLOYMENT.md):
#   variables: AZURE_API_APP_NAME, AZURE_WEB_APP_NAME   (App Service names)
#   secrets:   AZURE_API_PUBLISH_PROFILE, AZURE_WEB_PUBLISH_PROFILE
# Keep NODE_VERSION below in sync with the App Service Node runtime.

env:
  AZURE_API_APP_NAME: ${{ vars.AZURE_API_APP_NAME }}
  AZURE_WEB_APP_NAME: ${{ vars.AZURE_WEB_APP_NAME }}
  NODE_VERSION: '22'

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        env:
          AZURE_API_PUBLISH_PROFILE: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
        run: |
          if [ -z "$AZURE_API_APP_NAME" ]; then echo "::error::Set repository variable AZURE_API_APP_NAME (see DEPLOYMENT.md)"; exit 1; fi
          if [ -z "$AZURE_API_PUBLISH_PROFILE" ]; then echo "::error::Set repository secret AZURE_API_PUBLISH_PROFILE (see DEPLOYMENT.md)"; exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Build
        working-directory: apps/api
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      - name: Package
        working-directory: apps/api
        run: zip -r ../api-deploy.zip dist node_modules package.json start-api.sh

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          package: apps/api-deploy.zip

      - name: Smoke test
        run: |
          for i in $(seq 1 15); do
            if curl -fsS "https://${AZURE_API_APP_NAME}.azurewebsites.net/api/health" > /dev/null; then
              echo "API is healthy"; exit 0
            fi
            sleep 10
          done
          echo "::error::API did not become healthy in time"; exit 1

  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        env:
          AZURE_WEB_PUBLISH_PROFILE: ${{ secrets.AZURE_WEB_PUBLISH_PROFILE }}
        run: |
          if [ -z "$AZURE_WEB_APP_NAME" ]; then echo "::error::Set repository variable AZURE_WEB_APP_NAME (see DEPLOYMENT.md)"; exit 1; fi
          if [ -z "$AZURE_WEB_PUBLISH_PROFILE" ]; then echo "::error::Set repository secret AZURE_WEB_PUBLISH_PROFILE (see DEPLOYMENT.md)"; exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Build
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          npm prune --omit=dev

      - name: Package
        working-directory: apps/web
        run: zip -r ../web-deploy.zip .next node_modules package.json next.config.mjs start-azure.sh

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEB_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEB_PUBLISH_PROFILE }}
          package: apps/web-deploy.zip

      - name: Smoke test
        run: |
          for i in $(seq 1 15); do
            if curl -fsS -o /dev/null "https://${AZURE_WEB_APP_NAME}.azurewebsites.net/"; then
              echo "Web app is healthy"; exit 0
            fi
            sleep 10
          done
          echo "::error::Web app did not become healthy in time"; exit 1
